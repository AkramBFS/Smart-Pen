<!DOCTYPE html>
<html lang="en">
<head>              
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS project || Smart Pen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    
   <div class="container">
        <form method="POST" action="" id="log-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="ID">ID:</label>
            <input type="date" id="ID" name="ID" required>
            <button type="submit">Log</button>
        </form>
        <h1>Smart Pen Controller</h1>
        <button class="start-btn">Start Recording</button>
        <button class="pause-btn">Pause Recording</button>
    </div>
    
    <script>
document.querySelector(".start-btn").onclick = () => {
    const form = document.getElementById("log-form");
    const formData = new FormData(form);

    fetch("/start", { method: "POST", body: formData })
        .then(r => r.json())
        .then(d => alert("Recording Started!"));
};

document.querySelector(".pause-btn").onclick = () => {
    fetch("/stop", { method: "POST" })
        .then(r => r.json())
        .then(d => alert("Recording Stopped!"));
};
</script>

</body>
</html>
